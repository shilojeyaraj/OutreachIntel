name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for changelog generation)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          OPENROUTER_API_KEY: ci-stub-key
        run: npm run build

      - name: Package .next as artifact
        run: |
          tar -czf coldreach-intel-${{ github.ref_name }}.tar.gz .next public package.json package-lock.json next.config.js

      # Auto-generate release notes from commit messages since the last tag.
      # Conventional Commits show up nicely under their `feat:` / `fix:` groups.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: coldreach-intel-${{ github.ref_name }}.tar.gz
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
