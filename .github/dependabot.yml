version: 2

updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'javascript']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      # Bundle non-major React/Next.js bumps so we don't get 4 PRs at once.
      react-stack:
        patterns: ['react', 'react-dom', '@types/react*']
        update-types: ['minor', 'patch']
      next-stack:
        patterns: ['next', 'eslint-config-next']
        update-types: ['minor', 'patch']
      testing:
        patterns: ['jest*', '@testing-library/*']
        update-types: ['minor', 'patch']

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'ci(deps)'
